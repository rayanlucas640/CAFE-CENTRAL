<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Café Central - Faça login e acesse sua experiência premium em cafés especiais.">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">

    <title>Café Central - Login</title>
</head>

<body>

    <!-- HEADER -->
    <header class="topo">

        <div class="logo">
            <a href="../index.html">Café<span>Central</span></a>
        </div>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="servicos.html">Serviços</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>

    </header>


    <!-- LOGIN -->
    <main class="container pagina-auth">

        <section class="bloco-auth">

            <h1>Bem-vindo de volta</h1>

            <p class="texto-auth">
                Entre para acessar o cardápio exclusivo do Café Central
            </p>

            <form class="form-auth" id="formLogin">

                <label for="emailLogin">E-mail</label>
                <input type="email" id="emailLogin" placeholder="Digite seu e-mail" required>

                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" placeholder="Digite sua senha" required>

                <button type="submit" class="btn-primario">Entrar</button>

                <p id="mensagemLogin" class="mensagem-auth"></p>

            </form>

            <p class="link-auth">
                Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
            </p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="rodape">
        <p>© 2026 Café Central. Todos os direitos reservados</p>
        <p><a href="contato.html">Entre em contato</a></p>
    </footer>


    <script src="../js/auth.js"></script>

</body>
</html>

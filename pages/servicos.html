<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Café Central - Nossos serviços e experiências em cafés especiais.">
    
    <link rel="stylesheet" href="../css/style.css">

    <title>Café Central - Serviços</title>
</head>

<body>

    <!-- PROTEÇÃO DE ACESSO (LOGIN) -->
    <script>
        fetch("http://localhost:3000/me", {
            credentials: "include"
        })
        .then(resposta => {
            if (!resposta.ok) {
                alert("Você precisa estar logado para acessar nossos serviços!");
                window.location.href = "login.html";
            }
        })
    </script>


    <!-- HEADER -->
    <header class="topo">

        <div class="logo">
            <a href="../index.html">Café<span>Central</span></a>
        </div>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="servicos.html" class="ativo">Serviços</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>


    <!-- CONTEÚDO -->
    <section class="servicos">

        <h1>Experiências e Serviços</h1>

        <p class="texto-servicos">
            Descubra nossos cafés especiais e experiências exclusivas preparadas com qualidade artesanal.
        </p>

        <!-- BUSCA -->
        <input id="BuscarServicos" placeholder="Buscar cafés ou serviços..." />


        <!-- LISTA DINÂMICA -->
        <div id="ListaServicos" class="servicos-grid">

            <!-- JS vai inserir os cards aqui -->

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="rodape">
        <p>© 2026 Café Central. Todos os direitos reservados</p>
        <p><a href="contato.html">Entre em contato</a></p>
    </footer>


    <script src="../js/script.js"></script>

</body>
</html>

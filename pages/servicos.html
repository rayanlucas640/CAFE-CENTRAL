<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Café Central - Nossos serviços e experiências em cafés especiais.">
    <link rel="stylesheet" href="../css/style.css">
    <title>Café Central - Serviços</title>

    <script>
        async function verificarLogin() {
            try {
                const resposta = await fetch("http://127.0.0.1:3000/me", {
                    method: "GET",
                    credentials: "include"
                });

                if (!resposta.ok) {
                    console.log("❌ Usuário não autenticado.");
                    alert("Você precisa estar logado para acessar nossos serviços!");
                    window.location.replace("login.html");
                    return false;
                }

                const dados = await resposta.json();

                console.log("☕ Dados recebidos do servidor:", dados);
                console.log("👤 Usuário:", dados.usuario);

                if (!dados.usuario || !dados.usuario.nome) {
                    console.error("❌ O servidor não retornou o nome do usuário.");
                    console.error("Resposta recebida:", dados);
                    return false;
                }

                window.usuarioLogado = dados.usuario;

                const usuarioElemento = document.getElementById("usuarioLogado");

                if (usuarioElemento) {
                    usuarioElemento.textContent =
                        `☕ Olá, ${dados.usuario.nome}! Aproveite nossos serviços.`;
                }

                

                console.log("✅ Usuário autenticado:", dados.usuario.nome);

                return true;

            } catch (erro) {
                console.error("❌ Erro ao verificar login:", erro);

                alert("Não foi possível verificar seu login. Tente novamente.");

                window.location.replace("login.html");

                return false;
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            verificarLogin();
        });
    </script>
</head>

<body>

    <header class="topo">
        <div class="logo">
            <a href="../index.html">Café<span>Central</span></a>
        </div>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="servicos.html" class="ativo">Serviços</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="servicos">
            <h1>Experiências e Serviços</h1>

            <p class="texto-servicos">
                Descubra nossos cafés especiais e experiências exclusivas
                preparadas com qualidade artesanal.
            </p>

            <p id="usuarioLogado" class="texto-servicos">
                Carregando usuário...
            </p>

            <input
                type="text"
                id="BuscarServicos"
                placeholder="Buscar cafés ou serviços..."
                autocomplete="off"
            >

            <div id="ListaServicos" class="servicos-grid"></div>

            <p id="mensagemCarregamento" class="mensagem-auth">
                Carregando nossos cafés...
            </p>
        </section>
    </main>

    <footer class="rodape">
        <p>© 2026 Café Central. Todos os direitos reservados</p>

        <p>
            <a href="contato.html">Entre em contato</a>
        </p>
    </footer>

    <script src="../js/script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const mensagemCarregamento =
                document.getElementById("mensagemCarregamento");

            if (mensagemCarregamento) {
                setTimeout(function () {
                    mensagemCarregamento.style.display = "none";
                }, 1000);
            }
        });
    </script>

</body>
</html>

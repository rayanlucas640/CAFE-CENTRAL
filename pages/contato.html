<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Café Central - Entre em contato conosco.">

    <link rel="stylesheet" href="../css/style.css">

    <title>Café Central - Contato</title>
</head>

<body>

    <!-- HEADER -->
    <header class="topo">
        <div class="logo">
            <a href="../index.html">Café<span>Central</span></a>
        </div>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
            <a href="login.html" class="btn-login">Entrar</a>
        </nav>
    </header>


    <!-- CONTEÚDO -->
    <main class="container pagina-auth">

        <section class="bloco-auth">

            <h1>Fale Conosco ☕</h1>

            <p class="texto-auth">
                Envie sua mensagem para nossa equipe. Respondemos o mais rápido possível.
            </p>

            <!-- FORMULÁRIO DE CONTATO -->
            <form class="form-auth" id="formContato">

                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" placeholder="Escreva sua mensagem..." required></textarea>

                <button type="submit" class="btn-primario">Enviar Mensagem</button>

                <p id="mensagemContato" class="mensagem-auth"></p>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="rodape">
        <p>© 2026 Café Central. Todos os direitos reservados</p>
        <p><a href="contato.html">Entre em contato</a></p>
    </footer>


    <!-- SCRIPT CONTATO -->
    <script src="../js/contato.js"></script>

</body>

</html>
